# The gate on every change: typecheck + tests, on push and on pull request.
#
# Deliberately minimal (locked decision #11) — one job, one platform, no matrix
# and no caching. The point is that `bun run typecheck` and `bun run test` run
# at all: until this existed, `.github/workflows/` held only the tag-triggered
# release, so nothing checked a branch before it merged.
#
# The setup steps are copied from release.yml so a green CI run and a release
# build agree on versions. Keep them in step.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14' # matches engines.bun floor

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # the PTY sidecar runtime

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
