# Install smoke on every OS runcastle claims: a clean runner installs the package
# the way the README says (`bun add -g`), then scripts/platform-smoke/smoke.ts
# checks the per-OS parts — node-pty's native addon, a real PTY through the
# sidecar, the doctor, a server boot. macOS is the reason this exists: there is no
# container for it, so this is the only check it gets short of a real Mac.
#
# Separate from ci.yml on purpose — that one stays one platform, no matrix
# (locked decision #11). Run this by hand before a release, or against a
# published version to verify what users actually download.
name: platform-smoke

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Registry spec to smoke (e.g. runcastle@latest). Empty = build this ref.'
        required: false
        default: ''
      tests:
        description: 'Also run the full vitest suite on macOS'
        type: boolean
        default: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14' # matches engines.bun floor

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # the README's floor for the PTY sidecar

      - name: Build the package from this ref
        if: inputs.spec == ''
        shell: bash
        env:
          RUNCASTLE_RELEASE_VERSION: 0.0.0-smoke.${{ github.sha }}
        run: |
          bun install --frozen-lockfile
          (cd packages/server && bun run build:pkg)
          mkdir -p "$RUNNER_TEMP/pack"
          (cd packages/server/build && bun pm pack --destination "$RUNNER_TEMP/pack")
          echo "RUNCASTLE_SPEC=$(ls "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_ENV"
          # Install from a dir with no node_modules, like a user would.
          rm -rf node_modules

      - name: Use the registry spec
        if: inputs.spec != ''
        shell: bash
        run: echo "RUNCASTLE_SPEC=${{ inputs.spec }}" >> "$GITHUB_ENV"

      - name: Smoke
        shell: bash
        run: bun scripts/platform-smoke/smoke.ts

  macos-tests:
    if: inputs.tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
