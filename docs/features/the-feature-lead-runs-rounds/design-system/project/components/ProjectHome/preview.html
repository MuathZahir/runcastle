<!-- @dsCard group="Pages" height=760 width=1280 page subtitle="The project page, redesigned" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProjectHome — page</title>
<style>html,body{background:var(--canvas)} .rc-shell{height:760px}</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.Runcastle, h = React.createElement;

  function Logo(){return h('svg',{width:18,height:18,viewBox:'0 0 32 32','aria-hidden':true},h('path',{fillRule:'evenodd',d:'M4 29 V6 H10 V11 H13 V6 H19 V11 H22 V6 H28 V29 H4 Z M12.5 15 L21.5 20 L12.5 25 Z',fill:'var(--text)'}))}
  function Sidebar(p){
    return h('aside',{className:'rc-shell__side'},
      h('div',{style:{display:'flex',alignItems:'center',gap:8,height:36,padding:'0 6px 0 10px'}},
        Logo(), h('span',{style:{fontWeight:600,fontSize:13}},'runcastle'), h(R.Icon,{name:'chevron-down',size:14}),
        h('span',{className:'rc-spacer'}), h(R.IconButton,{icon:'pencil',size:'sm',label:'New feature'})),
      h('div',{style:{padding:'4px 2px 8px'}}, h(R.Input,{icon:'search',placeholder:'Search',kbd:'Ctrl K'})),
      h(R.NavItem,{icon:'folder',label:'Project',active:p.active==='project'}),
      h(R.NavItem,{icon:'message',label:'Chats',meta:'14'}),
      h(R.NavItem,{icon:'activity',label:'Activity',dot:'live',dotLabel:'1 session live'}),
      h('div',{style:{height:12}}),
      h(R.SectionLabel,{count:1},'Drafts'),
      h(R.NavItem,{phase:'draft',label:'Auto-continue burns after provider limit reset'}),
      h('div',{style:{height:8}}),
      h(R.SectionLabel,{count:104},'Shipped'),
      h(R.NavItem,{phase:'shipped',label:'Settings shows step models through the legacy migration',active:p.active==='feature'}),
      h(R.NavItem,{phase:'shipped',label:'MCP read tools stay within a context budget'}),
      h(R.NavItem,{phase:'shipped',label:'Session-assigned ticket models must be annotated'}),
      h(R.NavItem,{phase:'shipped',label:'Model roster discovers new models'}),
      h(R.NavItem,{phase:'shipped',label:'Sandbox agent CLIs track the host version'}),
      h('a',{className:'rc-nav',href:'#',style:{color:'var(--text-tertiary)'}},h('span',{style:{width:16}}),h('span',{className:'rc-nav__label'},'Show all')),
      h('span',{className:'rc-spacer'}),
      h(R.NavItem,{icon:'undo',label:'Re-prepare project',meta:'1 stale'}),
      h('div',{className:'rc-meta',style:{padding:'8px 10px 4px',gap:'6px 12px'}},
        h('span',{className:'rc-meta__item'},h(R.StatusDot,{tone:'success'}),'Server'),
        h('span',{className:'rc-meta__item'},h(R.Icon,{name:'cube',size:14}),'docker'),
        h('span',{className:'rc-spacer'}),
        h(R.IconButton,{icon:'settings',size:'sm',label:'Settings'})));
  }

  function Action(p){
    return h('div',{style:{display:'flex',alignItems:'center',gap:16,padding:'16px 0',borderBottom:'1px solid var(--border-subtle)'}},
      h('span',{style:{width:32,height:32,display:'grid',placeItems:'center',borderRadius:'var(--radius-md)',background:'var(--surface-hover)'}},h(R.Icon,{name:p.icon})),
      h('div',{style:{flex:1,minWidth:0}},h('div',{style:{fontWeight:500}},p.title),h('div',{style:{color:'var(--text-tertiary)'}},p.hint)),
      p.action);
  }
  function Main(){
    return h('main',{className:'rc-shell__main'},
      h('header',{className:'rc-topbar'},
        h('div',{className:'rc-crumbs'},h(R.Icon,{name:'folder',size:14}),h('b',null,'runcastle')),
        h('span',{className:'rc-spacer'}),
        h(R.IconButton,{icon:'panel-right',label:'Toggle details'})),
      h('div',{className:'rc-page'},h('div',{className:'rc-page__inner'},
        h('h1',{className:'rc-title-lg'},'runcastle'),
        h('div',{style:{height:8}}),
        h(R.MetaLine,{items:[{icon:'branch',text:'runcastle/project'},{icon:'arrow-right',text:'lands on main'}]}),
        h('div',{style:{height:32}}),
        h(Action,{icon:'sparkle',title:'Talk it through',hint:'Bring a raw idea; the chat checks it against what’s built and cuts it into features.',action:h(R.Button,{variant:'primary',icon:'plus',kbd:'C'},'New chat')}),
        h(Action,{icon:'play',title:'Test drive',hint:'Run everything that has shipped on main and jot what you notice.',action:h(R.Button,{icon:'play'},'Start')}),
        h(R.Disclosure,{title:'Drive setup',icon:'terminal',aside:'project-drive · main'},h('div',{className:'rc-mono',style:{background:'var(--surface-inset)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-md)',padding:12,color:'var(--text-secondary)'}},'bun .runcastle/drive-setup.ts')),
        h('div',{style:{height:32}}),
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:4}},h('h2',{className:'rc-title',style:{flex:1}},'Chats'),h(R.Input,{icon:'search',placeholder:'Filter',width:200})),
        h('div',{className:'rc-list'},
          h(R.ListRow,{dot:'live',title:'Untitled chat',meta:'22m'}),
          h(R.ListRow,{icon:'message',title:'Problem: runcastle sandbox image is stale',meta:'2d'}),
          h(R.ListRow,{icon:'message',title:'Many small UI/UX issues',meta:'5d'}),
          h(R.ListRow,{icon:'message',title:'A couple of things to fix with runcastle',meta:'5d'}),
          h(R.ListRow,{icon:'message',title:'Why did I get this in another project?',meta:'5d'}),
          h(R.ListRow,{icon:'message',title:'Set model to Fable 5.1',meta:'7d'})))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'rc-shell'},Sidebar({active:'project'}),Main()));
</script>
</body>
</html>
